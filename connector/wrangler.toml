name = "printopus-connettore"
main = "dist/worker.js"
compatibility_date = "2026-10-01"

# Le sessioni vivono in un Durable Object (coerente, disponibile anche nel piano gratuito).
[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionStore"]

# KV usato prima dei Durable Object: serve solo a recuperare le sessioni vecchie (scadono entro 7 giorni).
# La GitHub Action sostituisce l'id; senza id la riga resta il segnaposto e il recupero non serve.
[[kv_namespaces]]
binding = "SESSIONS"
id = "SOSTITUISCI_CON_ID_DEL_KV"

[vars]
APP_URL = "https://marketto.github.io/tako-maker/"
ALLOWED_ORIGIN = "https://marketto.github.io"
