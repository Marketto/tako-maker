name = "printopus-connettore"
main = "dist/worker.js"
compatibility_date = "2026-10-01"

# Prima di pubblicare: crea il KV con `npx wrangler kv namespace create SESSIONS`
# e incolla qui l'id (o lascia che lo faccia la GitHub Action, vedi docs/CONNETTORE.md).
[[kv_namespaces]]
binding = "SESSIONS"
id = "SOSTITUISCI_CON_ID_DEL_KV"

[vars]
APP_URL = "https://marketto.github.io/tako-maker/"
ALLOWED_ORIGIN = "https://marketto.github.io"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false
